# .github/workflows/ai-log-analysis.yaml
name: AI Log Analysis

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  analyze-failures:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Get logs from failed workflow
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log > failure-logs.txt
      
      - name: Analyze with GPT-4
        run: |
          python scripts/ai-log-analyzer.py failure-logs.txt
      
      - name: Post results to PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file ai-analysis-results.md