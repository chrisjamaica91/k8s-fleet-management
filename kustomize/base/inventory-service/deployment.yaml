apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        version: v1.0.0
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "fleet-services"
        vault.hashicorp.com/agent-inject-secret-kafka: "secret/data/kafka/credentials"
        vault.hashicorp.com/agent-inject-template-kafka: |
          {{- with secret "secret/data/kafka/credentials" -}}
          export KAFKA_BROKERS="{{ .Data.data.bootstrap_servers }}"
          export KAFKA_USERNAME="{{ .Data.data.username }}"
          export KAFKA_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-init-cpu: "50m"
        vault.hashicorp.com/agent-init-mem: "32Mi"
        vault.hashicorp.com/agent-cpu: "50m"
        vault.hashicorp.com/agent-mem: "32Mi"
        traffic.sidecar.istio.io/excludeOutboundPorts: "8200"
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: KAFKA_BROKERS
              value: "fleet-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: SPRING_PROFILES_ACTIVE
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
